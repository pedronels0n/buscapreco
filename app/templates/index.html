{% extends 'base.html' %}
{% block conteudo %}
    <form action="/codigo" method="GET">
        <label for="codigo_barras">Digite o código de barras:</label><br>
        <input type="text" id="codigo_barras" name="codigo_barras" autofocus autocomplete="off"><br><br>
        <input type="hidden" name="mercado" id="mercado" value="{{ mercado }}">
        <input type="submit" value="Buscar">
    </form>
{% endblock conteudo %}
